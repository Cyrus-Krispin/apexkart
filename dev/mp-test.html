<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ApexKart · multiplayer test bench</title>
    <!-- Dev only (not part of the build): N players side by side, each iframe with its own
         identity (?player=N), so one browser tab can test a whole room. /dev/mp-test.html?n=3 -->
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      .grid { display: grid; height: 100%; gap: 2px; background: #333; }
      iframe { width: 100%; height: 100%; border: 0; background: #0b0d12; }
    </style>
  </head>
  <body>
    <div class="grid" id="grid"></div>
    <script type="module">
      const q = new URLSearchParams(location.search);
      const n = Math.min(4, Math.max(1, Number(q.get('n')) || 2));
      const room = q.get('room');
      const grid = document.getElementById('grid');
      grid.style.gridTemplateColumns = n > 2 ? '1fr 1fr' : `repeat(${n}, 1fr)`;
      for (let i = 1; i <= n; i++) {
        const f = document.createElement('iframe');
        f.id = `p${i}`;
        f.allow = 'clipboard-write';
        f.src = `/?player=${i}#/room${room ? '/' + room : ''}`;
        grid.appendChild(f);
      }
    </script>
  </body>
</html>
